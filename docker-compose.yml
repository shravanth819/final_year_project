services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agrimitra
      POSTGRES_USER: agrimitra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimitra -d agrimitra"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://agrimitra:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres/agrimitra
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      SENSOR_TOKEN: ${SENSOR_TOKEN:?SENSOR_TOKEN must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-900}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-900}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:?AUTH_PUBLIC_BASE_URL must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    environment:
      API_BASE_URL: http://backend:8000
    depends_on: [backend]
    ports: ["8501:8501"]
  landing:
    image: nginx:alpine
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    ports: ["8080:80"]
volumes:
  postgres_data:
